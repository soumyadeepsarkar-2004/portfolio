<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- Window Container -->
  <rect width="1200" height="675" rx="12" fill="#0f0914" stroke="#ec4899" stroke-width="2"/>
  
  <!-- Browser Top Bar -->
  <rect width="1200" height="42" rx="12" fill="#180c24"/>
  <rect y="30" width="1200" height="12" fill="#180c24"/>
  <circle cx="20" cy="21" r="6" fill="#ef4444"/>
  <circle cx="38" cy="21" r="6" fill="#eab308"/>
  <circle cx="56" cy="21" r="6" fill="#22c55e"/>
  
  <!-- Address Bar -->
  <rect x="100" y="8" width="500" height="26" rx="6" fill="#2d124d"/>
  <text x="115" y="25" fill="#f472b6" font-family="monospace" font-size="12">https://twoheartsbeat.vercel.app</text>

  <!-- App Header -->
  <rect x="0" y="42" width="1200" height="65" fill="#1f0933" stroke="#831843" stroke-width="1"/>
  <text x="40" y="82" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="24" font-weight="900">HEARTBEATS ARCADE</text>
  <rect x="1000" y="58" width="160" height="32" rx="16" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899"/>
  <circle cx="1020" cy="74" r="5" fill="#22c55e"/>
  <text x="1035" y="79" fill="#f472b6" font-family="monospace" font-size="12" font-weight="600">Room #402 • 2 Live</text>

  <!-- Music Audio Visualizer Banner -->
  <rect x="40" y="130" width="1120" height="160" rx="12" fill="#2a083b" stroke="#db2777" stroke-width="1.5"/>
  <text x="70" y="170" fill="#fda4af" font-family="system-ui, sans-serif" font-size="14" font-weight="600">NOW STREAMING IN SYNC</text>
  <text x="70" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Midnight Lo-Fi Beats (Synchronized)</text>
  
  <!-- Audio Waveform Bars -->
  <rect x="70" y="225" width="8" height="40" rx="4" fill="#f43f5e"/>
  <rect x="85" y="215" width="8" height="50" rx="4" fill="#ec4899"/>
  <rect x="100" y="235" width="8" height="30" rx="4" fill="#f43f5e"/>
  <rect x="115" y="205" width="8" height="60" rx="4" fill="#f472b6"/>
  <rect x="130" y="220" width="8" height="45" rx="4" fill="#f43f5e"/>
  <rect x="145" y="210" width="8" height="55" rx="4" fill="#ec4899"/>
  <rect x="160" y="230" width="8" height="35" rx="4" fill="#f472b6"/>
  <rect x="175" y="220" width="8" height="45" rx="4" fill="#f43f5e"/>

  <text x="1000" y="250" fill="#f472b6" font-family="monospace" font-size="14" font-weight="600">02:45 / 03:50</text>

  <!-- Minigame Section -->
  <text x="40" y="330" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="20" font-weight="700">MULTIPLAYER MINIGAMES</text>

  <!-- Game Card 1 -->
  <rect x="40" y="355" width="350" height="270" rx="12" fill="#1f0933" stroke="#a21caf" stroke-width="1"/>
  <rect x="55" y="370" width="320" height="150" rx="8" fill="#3b0764"/>
  <text x="215" y="450" fill="#f472b6" font-family="monospace" font-size="16" text-anchor="middle">🎵 Rhythm Beat Matcher</text>
  <text x="55" y="550" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Beat Matcher 2P</text>
  <text x="55" y="575" fill="#f472b6" font-family="monospace" font-size="12">Tap tiles in rhythm to the live track</text>
  <text x="55" y="600" fill="#4ade80" font-family="monospace" font-size="12">High Score: 14,200 pts</text>

  <!-- Game Card 2 -->
  <rect x="425" y="355" width="350" height="270" rx="12" fill="#1f0933" stroke="#a21caf" stroke-width="1"/>
  <rect x="440" y="370" width="320" height="150" rx="8" fill="#3b0764"/>
  <text x="600" y="450" fill="#f472b6" font-family="monospace" font-size="16" text-anchor="middle">🕹️ Pixel Pong Duo</text>
  <text x="440" y="550" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Co-op Pixel Pong</text>
  <text x="440" y="575" fill="#f472b6" font-family="monospace" font-size="12">Classic 2-player paddle battle</text>
  <text x="440" y="600" fill="#4ade80" font-family="monospace" font-size="12">High Score: 32 Rallies</text>

  <!-- Game Card 3 -->
  <rect x="810" y="355" width="350" height="270" rx="12" fill="#1f0933" stroke="#a21caf" stroke-width="1"/>
  <rect x="825" y="370" width="320" height="150" rx="8" fill="#3b0764"/>
  <text x="985" y="450" fill="#f472b6" font-family="monospace" font-size="16" text-anchor="middle">👾 Retro Space Runner</text>
  <text x="825" y="550" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Space Co-Runner</text>
  <text x="825" y="575" fill="#f472b6" font-family="monospace" font-size="12">Dodge obstacles together in real-time</text>
  <text x="825" y="600" fill="#4ade80" font-family="monospace" font-size="12">High Score: Level 18</text>
</svg>
