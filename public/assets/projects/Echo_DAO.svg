<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="echo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="celo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#35d07f"/>
      <stop offset="100%" stop-color="#fbcc5c"/>
    </linearGradient>
    <linearGradient id="card-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Container Frame -->
  <rect width="1200" height="675" rx="12" fill="url(#echo-bg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <rect width="1200" height="42" rx="12" fill="#0f172a"/>
  <rect y="30" width="1200" height="12" fill="#0f172a"/>
  <circle cx="20" cy="21" r="6" fill="#ef4444"/>
  <circle cx="38" cy="21" r="6" fill="#eab308"/>
  <circle cx="56" cy="21" r="6" fill="#22c55e"/>
  
  <!-- Address Bar -->
  <rect x="100" y="8" width="500" height="26" rx="6" fill="#1e293b"/>
  <text x="115" y="25" fill="#94a3b8" font-family="monospace" font-size="12">https://celo-demo-ten.vercel.app</text>
  
  <rect x="1010" y="10" width="170" height="22" rx="11" fill="url(#celo-grad)"/>
  <text x="1095" y="25" fill="#090d16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CELO MAINNET • IPFS</text>

  <!-- Navbar -->
  <rect x="0" y="42" width="1200" height="54" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
  
  <circle cx="36" cy="69" r="14" fill="url(#celo-grad)"/>
  <text x="36" y="74" fill="#090d16" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">E</text>
  <text x="60" y="74" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">EchoDAO</text>
  <text x="150" y="74" fill="#35d07f" font-family="monospace" font-size="12">Governance & AI Verification</text>

  <!-- Nav Links -->
  <text x="500" y="74" fill="#35d07f" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Proposals</text>
  <text x="600" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Treasury</text>
  <text x="690" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">AI Verifier</text>
  <text x="790" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">IPFS Node</text>

  <!-- Connect Wallet Button -->
  <rect x="1010" y="55" width="170" height="28" rx="14" fill="#1e293b" stroke="#35d07f" stroke-width="1"/>
  <circle cx="1025" cy="69" r="4" fill="#35d07f"/>
  <text x="1037" y="73" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="600">0x89A...4fB2</text>

  <!-- Main Body Content -->
  <!-- Header Banner -->
  <rect x="20" y="112" width="1160" height="90" rx="10" fill="url(#card-glow)" stroke="#1e293b"/>
  <text x="45" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Decentralized Governance & AI Proposal Verification</text>
  <text x="45" y="172" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">On-chain voting with carbon-negative Celo smart contracts, IPFS metadata storage, and AI spam mitigation.</text>

  <!-- Stats Grid -->
  <!-- Stat 1 -->
  <rect x="20" y="218" width="275" height="80" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="35" y="243" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">DAO TREASURY</text>
  <text x="35" y="275" fill="#35d07f" font-family="system-ui, sans-serif" font-size="24" font-weight="800">1,450,000 CELO</text>

  <!-- Stat 2 -->
  <rect x="315" y="218" width="275" height="80" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="330" y="243" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">ACTIVE PROPOSALS</text>
  <text x="330" y="275" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="800">14 Active</text>

  <!-- Stat 3 -->
  <rect x="610" y="218" width="275" height="80" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="625" y="243" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">AI SPAM REJECTION</text>
  <text x="625" y="275" fill="#fbcc5c" font-family="system-ui, sans-serif" font-size="24" font-weight="800">99.8% Accuracy</text>

  <!-- Stat 4 -->
  <rect x="905" y="218" width="275" height="80" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="920" y="243" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">IPFS STORAGE PINNED</text>
  <text x="920" y="275" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="800">QmX89...Pinata</text>

  <!-- Proposal Card 1 -->
  <rect x="20" y="314" width="1160" height="155" rx="10" fill="#0f172a" stroke="#35d07f" stroke-width="1.5"/>
  <rect x="35" y="330" width="80" height="22" rx="4" fill="#35d07f" fill-opacity="0.2"/>
  <text x="75" y="345" fill="#35d07f" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">PASSED</text>
  
  <rect x="125" y="330" width="140" height="22" rx="4" fill="#1e293b"/>
  <text x="195" y="345" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">AI VERIFIED ✓</text>

  <text x="35" y="380" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">EIP-04: Allocate 50,000 CELO to Community Developer Grant Fund</text>
  <text x="35" y="403" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Proposal verified via Gemini AI Content Inspector for spam prevention and pinned immutably on IPFS.</text>

  <!-- Voting Progress Bar -->
  <rect x="35" y="425" width="850" height="12" rx="6" fill="#1e293b"/>
  <rect x="35" y="425" width="720" height="12" rx="6" fill="url(#celo-grad)"/>
  <text x="900" y="436" fill="#35d07f" font-family="system-ui, sans-serif" font-size="12" font-weight="700">84.7% YES (1.2M Votes)</text>

  <!-- Proposal Card 2 -->
  <rect x="20" y="485" width="1160" height="165" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <rect x="35" y="501" width="100" height="22" rx="4" fill="#fbcc5c" fill-opacity="0.2"/>
  <text x="85" y="516" fill="#fbcc5c" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">VOTING ACTIVE</text>
  
  <text x="35" y="550" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">EIP-05: Integrate Automated Liquid Staking Protocol on Celo</text>
  <text x="35" y="573" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Voting closes in 2 days. Smart contract security audit complete and stored on IPFS node.</text>
  
  <!-- Voting Progress Bar -->
  <rect x="35" y="595" width="850" height="12" rx="6" fill="#1e293b"/>
  <rect x="35" y="595" width="550" height="12" rx="6" fill="#38bdf8"/>
  <text x="900" y="606" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">64.7% YES (890k Votes)</text>
  
  <!-- Footer Attribution -->
  <text x="35" y="635" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Created by Soumyadeep Sarkar | Solidity • Celo • IPFS • React • Web3</text>
</svg>
