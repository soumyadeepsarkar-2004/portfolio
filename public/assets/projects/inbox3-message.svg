<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- Window Container -->
  <rect width="1200" height="675" rx="12" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  
  <!-- Browser Top Bar -->
  <rect width="1200" height="42" rx="12" fill="#18181b"/>
  <rect y="30" width="1200" height="12" fill="#18181b"/>
  <circle cx="20" cy="21" r="6" fill="#ef4444"/>
  <circle cx="38" cy="21" r="6" fill="#eab308"/>
  <circle cx="56" cy="21" r="6" fill="#22c55e"/>
  
  <!-- Address Bar -->
  <rect x="100" y="8" width="500" height="26" rx="6" fill="#27272a"/>
  <text x="115" y="25" fill="#a1a1aa" font-family="monospace" font-size="12">https://inbox3-message.vercel.app</text>
  <rect x="1050" y="10" width="130" height="22" rx="4" fill="#3f3f46"/>
  <text x="1115" y="25" fill="#e4e4e7" font-family="monospace" font-size="11" text-anchor="middle">Aptos Network</text>

  <!-- App Body Layout -->
  <!-- Left Sidebar (Chats) -->
  <rect x="0" y="42" width="320" height="633" fill="#111113" stroke="#27272a" stroke-width="1"/>
  <text x="20" y="75" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Inbox3 Web3</text>
  <rect x="20" y="90" width="280" height="32" rx="6" fill="#18181b" stroke="#27272a"/>
  <text x="32" y="111" fill="#71717a" font-family="monospace" font-size="12">Search wallet 0x...</text>
  
  <!-- Chat Item 1 -->
  <rect x="10" y="135" width="300" height="65" rx="8" fill="#18181b" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="38" cy="167" r="16" fill="#3b82f6"/>
  <text x="38" y="172" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">0x7</text>
  <text x="66" y="160" fill="#f4f4f5" font-family="monospace" font-size="13" font-weight="600">0x7a89...9b2c</text>
  <text x="66" y="178" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11">[Encrypted Payload]</text>

  <!-- Chat Item 2 -->
  <rect x="10" y="210" width="300" height="65" rx="8" fill="#141417"/>
  <circle cx="38" cy="242" r="16" fill="#8b5cf6"/>
  <text x="38" y="247" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">0x3</text>
  <text x="66" y="235" fill="#a1a1aa" font-family="monospace" font-size="13">0x3f12...e81d</text>
  <text x="66" y="253" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Session key verified</text>

  <!-- Chat Item 3 -->
  <rect x="10" y="285" width="300" height="65" rx="8" fill="#141417"/>
  <circle cx="38" cy="317" r="16" fill="#10b981"/>
  <text x="38" y="322" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">0x9</text>
  <text x="66" y="310" fill="#a1a1aa" font-family="monospace" font-size="13">0x9c44...01aa</text>
  <text x="66" y="328" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Aptos transaction confirmed</text>

  <!-- Main Chat Window -->
  <rect x="320" y="42" width="880" height="60" fill="#141417" stroke="#27272a" stroke-width="1"/>
  <circle cx="350" cy="72" r="14" fill="#3b82f6"/>
  <text x="375" y="72" fill="#f4f4f5" font-family="monospace" font-size="14" font-weight="600">0x7a89...9b2c</text>
  <rect x="1060" y="60" width="120" height="24" rx="12" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e"/>
  <text x="1120" y="76" fill="#4ade80" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">E2E Encrypted</text>

  <!-- Messages Area -->
  <rect x="340" y="130" width="400" height="55" rx="12" fill="#18181b" stroke="#27272a"/>
  <text x="355" y="162" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13">Hey! Sending session key over Move smart contract.</text>
  
  <rect x="760" y="200" width="420" height="55" rx="12" fill="#2563eb"/>
  <text x="775" y="232" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">Verified! Message decrypted on Petra wallet instantly.</text>

  <rect x="340" y="275" width="450" height="55" rx="12" fill="#18181b" stroke="#27272a"/>
  <text x="355" y="307" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13">Zero centralized server dependency. Fully decentralized!</text>

  <!-- Input Bar -->
  <rect x="340" y="600" width="750" height="45" rx="10" fill="#18181b" stroke="#27272a"/>
  <text x="360" y="627" fill="#71717a" font-family="system-ui, sans-serif" font-size="13">Type an encrypted message...</text>
  <rect x="1100" y="600" width="80" height="45" rx="10" fill="#3b82f6"/>
  <text x="1140" y="627" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Send</text>
</svg>
